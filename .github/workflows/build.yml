name: Build and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            qt-host: linux
            qt-arch: linux_gcc_64
            artifact: linux
          - os: windows-2022
            qt-host: windows
            qt-arch: win64_msvc2022_64
            artifact: windows
          - os: macos-15
            qt-host: mac
            qt-arch: clang_64
            artifact: macos

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake 4
        run: python -m pip install cmake==4.0.3

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build dpkg-dev rpm

      - name: Install WiX
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install wixtoolset -y
          "C:\Program Files (x86)\WiX Toolset v3.14\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: ${{ matrix.qt-host }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Create CPack packages
        run: cpack --config build/CPackConfig.cmake --verbose

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: graphai-${{ matrix.artifact }}
          path: |
            build/packages/*.deb
            build/packages/*.rpm
            build/packages/*.tar.gz
            build/packages/*.zip
            build/packages/*.msi
            build/packages/*.dmg
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake 4
        run: python -m pip install cmake==4.0.3

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: all_os
          target: android
          arch: android_armv7
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Fix Qt permissions
        run: |
          chmod +x "$QT_ROOT_DIR"/bin/* || true
          chmod +x "$QT_ROOT_DIR"/libexec/* || true
          chmod +x "$QT_HOST_PATH"/bin/* || true
          chmod +x "$QT_HOST_PATH"/libexec/* || true

      - name: Configure
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" \
            -S . -B build-android -G Ninja \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build APK
        run: cmake --build build-android --target apk --parallel

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > release.jks
          APK=$(find build-android/android-build/build/outputs/apk -name '*-unsigned.apk' | head -n1)
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks release.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out graphai-release.apk aligned.apk
          "$BT/apksigner" verify graphai-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: graphai-android
          path: graphai-release.apk
          if-no-files-found: error
